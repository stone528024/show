        id="next-btn" onclick="handleNextClick()" type="button">
        <span id="next-btn-text">选好了，下一题 →</span>
        <span class="material-symbols-outlined text-[20px]" id="next-btn-icon">arrow_forward</span>
      </button>
    </div>
  </div>
  <script>
    let currentStep = 1;
    const totalSteps = 3;
    const userAnswers = { 1: null, 2: null, 3: null };
    let toastTimer = null;

    function showToast(message) {
      const toast = document.getElementById('toast-tip');
      if (!toast) return;
      toast.querySelector('span:last-child').textContent = message || "请先选择您的搭子选项哦～";
      toast.classList.remove('-translate-y-4', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('-translate-y-4', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2000);
    }

    function triggerShake(element) {
      element.classList.remove('animate-shake');
      void element.offsetWidth;
      element.classList.add('animate-shake');
      setTimeout(() => {
        element.classList.remove('animate-shake');
      }, 450);
    }

    function syncViewportHeight() {
      const viewport = document.getElementById('cards-viewport');
      const activeCard = document.querySelector(`.quiz-card[data-step="${currentStep}"]`);
      if (viewport && activeCard) {
        viewport.style.height = (activeCard.offsetHeight + 12) + 'px';
      }
    }

    function updateUI() {
      // 1. Update Segmented Progress Bar
      for (let i = 1; i <= totalSteps; i++) {
        const seg = document.getElementById('prog-seg-' + i);
        if (i <= currentStep) {
          seg.className = "h-full flex-1 rounded-full bg-secondary-fixed transition-all duration-300 shadow-[0_0_8px_rgba(253,228,0,0.8)]";
        } else {
          seg.className = "h-full flex-1 rounded-full bg-surface-variant transition-all duration-300";
        }
      }

      // 2. Update Counter Text
      document.getElementById('step-counter-text').innerHTML = `${currentStep}<span class="text-outline text-body-sm font-normal">/${totalSteps}</span>`;

      // 3. Update Cards Positions & Visibilities
      const cards = document.querySelectorAll('.quiz-card');
      cards.forEach(card => {
        const step = parseInt(card.getAttribute('data-step'), 10);
        if (step === currentStep) {
          card.className = "quiz-card absolute inset-x-0 top-0 transition-all duration-500 ease-out transform translate-x-0 opacity-100 scale-100 z-30 pointer-events-auto";
        } else if (step < currentStep) {
          card.className = "quiz-card absolute inset-x-0 top-0 transition-all duration-500 ease-out transform -translate-x-full opacity-0 scale-95 z-10 pointer-events-none";
        } else {
          card.className = "quiz-card absolute inset-x-0 top-0 transition-all duration-500 ease-out transform translate-x-full opacity-0 scale-95 z-20 pointer-events-none";
        }
      });

      syncViewportHeight();

      // 4. Update Prev Button State
      const prevBtn = document.getElementById('prev-btn');
      if (currentStep > 1) {
        prevBtn.className = "px-4 py-3.5 rounded-xl bg-surface-container-high text-on-surface font-label-lg text-label-lg flex items-center gap-1 active:scale-95 transition-all cursor-pointer opacity-100 pointer-events-auto hover:bg-surface-bright border border-white/5";
      } else {
        prevBtn.className = "opacity-40 pointer-events-none px-4 py-3.5 rounded-xl bg-surface-container-high text-on-surface-variant font-label-lg text-label-lg flex items-center gap-1 transition-all border border-transparent";
      }

      // 5. Update Next / Finish Button Validation State
      const nextBtn = document.getElementById('next-btn');
      const nextBtnText = document.getElementById('next-btn-text');
      const nextBtnIcon = document.getElementById('next-btn-icon');
      const isAnswered = !!userAnswers[currentStep];
      const allAnswered = Object.values(userAnswers).every(ans => !!ans);
      const isLastStep = currentStep === totalSteps;

      if (isLastStep) {
        nextBtnText.innerText = "生成搭子报告 →";
        nextBtnIcon.innerText = "auto_awesome";
        if (isAnswered && allAnswered) {
          nextBtn.className = "flex-1 py-3.5 px-6 rounded-xl bg-gradient-to-r from-secondary-container via-tertiary-fixed to-secondary-container text-on-secondary-container font-headline-sm text-headline-sm font-extrabold flex items-center justify-center gap-2 shadow-[0_0_24px_rgba(253,228,0,0.6)] active:scale-[0.98] transition-all cursor-pointer animate-pulse";
        } else {
          nextBtn.className = "flex-1 py-3.5 px-6 rounded-xl bg-surface-container-highest/80 text-outline font-headline-sm text-headline-sm font-bold flex items-center justify-center gap-2 opacity-40 cursor-not-allowed transition-all";
        }
      } else {
        nextBtnText.innerText = "选好了，下一题 →";
        nextBtnIcon.innerText = "arrow_forward";
        if (isAnswered) {
          nextBtn.className = "flex-1 py-3.5 px-6 rounded-xl bg-secondary-container text-on-secondary-container font-headline-sm text-headline-sm font-extrabold flex items-center justify-center gap-2 shadow-[0_4px_18px_rgba(253,228,0,0.35)] active:translate-y-0.5 active:shadow-none transition-all cursor-pointer hover:brightness-105";
        } else {
          nextBtn.className = "flex-1 py-3.5 px-6 rounded-xl bg-surface-container-highest/80 text-outline font-headline-sm text-headline-sm font-bold flex items-center justify-center gap-2 opacity-40 cursor-not-allowed transition-all";
        }
      }
    }

    function handleSelectOption(step, val, el) {
      userAnswers[step] = val;

      // Reset sibling buttons in same card
      const parentCard = el.closest('.quiz-card');
      const allButtons = parentCard.querySelectorAll('.opt-btn');
      allButtons.forEach(btn => {
        btn.className = "opt-btn group relative w-full text-left p-space-md rounded-xl bg-surface-container-high/80 hover:bg-surface-bright active:scale-[0.98] transition-all flex items-start gap-space-sm border border-transparent";
        const indicator = btn.querySelector('.opt-indicator');
        indicator.className = "opt-indicator w-7 h-7 rounded-lg bg-surface-variant text-on-surface-variant flex items-center justify-center font-headline-sm text-headline-sm font-bold flex-shrink-0 transition-colors";
        const title = btn.querySelector('.opt-title');
        title.className = "opt-title text-on-surface font-headline-sm text-headline-sm font-semibold transition-colors";
      });

      // Apply active neon selected state
      el.className = "opt-btn group relative w-full text-left p-space-md rounded-xl bg-primary-container text-on-primary-container shadow-[0_0_20px_rgba(26,72,203,0.55)] border border-primary/50 scale-[1.01] transition-all flex items-start gap-space-sm";
      const curIndicator = el.querySelector('.opt-indicator');
      curIndicator.className = "opt-indicator w-7 h-7 rounded-lg bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center font-headline-sm text-headline-sm font-bold flex-shrink-0 transition-colors shadow-sm";
      const curTitle = el.querySelector('.opt-title');
      curTitle.className = "opt-title text-white font-headline-sm text-headline-sm font-bold transition-colors";

      updateUI();
    }

    function handleNextClick() {
      const isAnswered = !!userAnswers[currentStep];
      const nextBtn = document.getElementById('next-btn');

      if (!isAnswered) {
        triggerShake(nextBtn);
        showToast("请先选择您的搭子选项哦～");
        return;
      }

      if (currentStep === totalSteps) {
        const allDone = Object.values(userAnswers).every(ans => !!ans);
        if (!allDone) {
          triggerShake(nextBtn);
          showToast("请先完善所有搭子测试题哦～");
          return;
        }
      }

      nextStep();
    }

    function nextStep() {
      if (currentStep < totalSteps) {
        if (!userAnswers[currentStep]) return;
        currentStep++;
        updateUI();
      } else {
        const allDone = Object.values(userAnswers).every(ans => !!ans);
        if (!allDone) {
          showToast("请先完善所有搭子测试题哦～");
          return;
        }
        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">sync</span><span>拼图中...</span>`;
        nextBtn.classList.add('pointer-events-none');
        setTimeout(() => {
          nextBtn.innerHTML = `<span id="next-btn-text">查看我的报告</span><span class="material-symbols-outlined text-[20px]" id="next-btn-icon">verified</span>`;
          nextBtn.classList.remove('pointer-events-none');
          location.href = './result.html';
        }, 900);
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        updateUI();
      }
    }

    // Touch Gesture Listeners (Full Screen Right-Swipe Detection for Back Navigation)
    let touchStartX = 0;
    let touchStartY = 0;

    const flowContainer = document.getElementById('quiz-flow-container');
    flowContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    flowContainer.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      if (diffX > 55 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
        prevStep();
      }
    }, { passive: true });

    window.addEventListener('resize', syncViewportHeight);
    window.addEventListener('load', syncViewportHeight);

    // Initial State Setup
    updateUI();
  </script>
  <div aria-hidden="true" data-snapdom-sandbox="true" id="snapdom-sandbox"
    style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div>

</body>

</html>
