<!DOCTYPE html>
<html class="dark" lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    name="viewport">
  <meta content="mobile_stack" name="shell-type">
  <link href="./css/css1.css" rel="stylesheet">
  <link href="./css/css2.css" rel="stylesheet">
  <link href="./css/css3.css" rel="stylesheet">
  <style>
    @layer base {

      html,
      body {
        width: 100vw;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #0b122b;
      }

      body {
        overscroll-behavior: none;
      }

      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }

      main>:first-child {
        margin-top: 0 !important;
      }

      main>:last-child {
        margin-bottom: 0 !important;
      }
    }

    ::-webkit-scrollbar {
      display: none;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-6px);
      }

      40%,
      80% {
        transform: translateX(6px);
      }
    }

    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
  <script src="./js/3.4.17.js?plugins=forms,container-queries"></script>
  <script
    id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary-container": "#ffb8c7", "on-error-container": "#ffdad6", "inverse-primary": "#2852d4", "primary-container": "#1a48cb", "surface-variant": "#2d334e", "outline": "#8e90a0", "surface-dim": "#0b122b", "tertiary-fixed": "#ffd9e0", "error-container": "#93000a", "primary-fixed": "#dde1ff", "on-secondary": "#373100", "on-tertiary": "#66002b", "on-secondary-fixed-variant": "#504700", "on-error": "#690005", "inverse-on-surface": "#292f49", "on-primary": "#002682", "tertiary-container": "#ab004e", "primary-fixed-dim": "#b7c4ff", "surface-container-lowest": "#060c25", "surface-container-high": "#222943", "secondary-fixed": "#fde400", "surface-container": "#181e38", "inverse-surface": "#dce1ff", "secondary": "#ffffff", "on-primary-fixed": "#001552", "surface-container-highest": "#2d334e", "tertiary-fixed-dim": "#ffb1c2", "on-primary-container": "#bdc8ff", "outline-variant": "#444654", "secondary-container": "#fde400", "primary": "#b7c4ff", "on-tertiary-fixed-variant": "#8f0040", "on-primary-fixed-variant": "#0038b6", "surface-tint": "#b7c4ff", "surface": "#0b122b", "on-tertiary-fixed": "#3f0018", "on-background": "#dce1ff", "on-secondary-container": "#716500", "tertiary": "#ffb1c2", "surface-container-low": "#131a33", "surface-bright": "#313853", "on-surface": "#dce1ff", "error": "#ffb4ab", "on-surface-variant": "#c4c5d7", "on-secondary-fixed": "#201c00", "secondary-fixed-dim": "#dec800", "background": "#0b122b" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "margin": "1.25rem", "gutter": "1rem", "space-2xl": "3rem", "margin-mobile": "1rem", "space-lg": "1.5rem", "space-md": "1rem", "space-xs": "0.25rem", "space-xl": "2rem", "gutter-sm": "0.75rem" }, fontFamily: { "headline-lg-mobile": ["Space Grotesk"], "headline-lg": ["Space Grotesk"], "label-sm": ["Space Grotesk"], "body-lg": ["Plus Jakarta Sans"], "display-hero-mobile": ["Space Grotesk"], "body-sm": ["Plus Jakarta Sans"], "label-md": ["Space Grotesk"], "headline-sm": ["Plus Jakarta Sans"], "display-hero": ["Space Grotesk"], "headline-md": ["Space Grotesk"], "body-md": ["Plus Jakarta Sans"], "label-lg": ["Space Grotesk"] }, fontSize: { "headline-lg-mobile": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "display-hero-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "700" }] } } } };</script>
</head>

<body
  class="bg-surface text-on-surface font-body-md relative overflow-x-hidden min-h-screen selection:bg-secondary-container selection:text-on-secondary-container">
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-24 right-1/4 w-96 h-96 rounded-full bg-primary-container/20 blur-[100px]"></div>
    <div class="absolute bottom-10 -left-12 w-80 h-80 rounded-full bg-tertiary-container/25 blur-[90px]"></div>
    <div
      class="absolute inset-0 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:24px_24px] opacity-10">
    </div>
  </div>
  <!-- Floating Light Toast for Validation -->
  <div
    class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 transform -translate-y-4 opacity-0 flex items-center gap-2 px-4 py-2.5 rounded-full bg-surface-container-highest/95 border border-primary/30 text-on-surface text-sm font-medium shadow-2xl backdrop-blur-xl"
    id="toast-tip">
    <span class="material-symbols-outlined text-[18px] text-secondary-fixed">info</span>
    <span>请先选择您的搭子选项哦～</span>
  </div>
  <header class="fixed top-0 inset-x-0 z-40 bg-surface/85 backdrop-blur-xl pt-safe">
    <div class="h-16 px-margin-mobile flex items-center justify-between">
      <div class="flex items-center gap-space-xs"><button aria-label="返回"
          class="w-11 h-11 rounded-full bg-surface-container/60 hover:bg-surface-container flex items-center justify-center text-on-surface transition-all active:scale-95"
          onclick="history.back()" type="button"><span
            class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button>
        <h1 class="font-headline-md text-headline-md tracking-tight text-on-surface pl-1">您的来信</h1>
      </div>
    </div>
  </header>
  <main class="flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-[100dvh] z-10">
    <div class="flex flex-col w-full px-margin-mobile pb-space-xl pt-space-md gap-space-lg relative">
      <div
        class="relative w-full rounded-xl bg-surface-container/90 backdrop-blur-xl shadow-xl overflow-hidden p-space-lg flex flex-col gap-space-md">
        <div
          class="absolute -top-16 -right-16 w-48 h-48 rounded-full bg-primary-container/30 blur-3xl pointer-events-none">
        </div>
        <div
          class="absolute -bottom-16 -left-16 w-44 h-44 rounded-full bg-tertiary-container/25 blur-3xl pointer-events-none">
        </div>
        <div class="relative flex items-center justify-between gap-space-sm">
          <div
            class="inline-flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-primary-container/40 text-primary">
            <span class="material-symbols-outlined text-[16px]"
              style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            <span class="font-label-sm text-label-sm tracking-widest uppercase">人生玩乐宣言</span>
          </div>
          <div class="inline-flex items-center gap-1 text-secondary-fixed">
            <span class="material-symbols-outlined text-[18px]"
              style="font-variation-settings: 'FILL' 1;">celebration</span>
            <span class="font-label-sm text-label-sm">2027 NYE</span>
          </div>
        </div>
        <div class="relative flex flex-col gap-space-xs pt-space-xs">
          <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">
            你有一封<br>来自长隆的跨年邀请函：
          </h2>
        </div>
        <div class="relative w-full h-36 rounded-xl overflow-hidden bg-surface-container-high shadow-md">
          <img class="w-full h-full object-cover"
            data-alt="A vibrant midnight carnival scene at Chimelong Paradise theme park with illuminated roller coasters, glowing neon ferris wheel, golden fireworks bursting in the deep midnight blue sky, and festive light trails in electric blue and hot magenta."
            src="./images/email-banner.jpg">
          <div class="absolute inset-0 bg-gradient-to-t from-surface-container via-surface-container/30 to-transparent">
          </div>
          <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between">
            <span
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container-lowest/80 text-secondary-fixed font-label-sm text-label-sm backdrop-blur-md">
              <span class="material-symbols-outlined text-[14px]"
                style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
              VIP 跨年通行证
            </span>
            <svg class="w-6 h-6 text-secondary-fixed opacity-90" fill="none" viewBox="0 0 24 24">
              <path d="M12 2L14.2 8.8L21 11L14.2 13.2L12 20L9.8 13.2L3 11L9.8 8.8L12 2Z" fill="currentColor"></path>
            </svg>
          </div>
        </div>
        <div class="relative flex flex-col gap-space-md py-space-sm text-on-surface">
          <div class="flex flex-col gap-1 p-space-md rounded-xl bg-surface-container-low/80">
            <p class="font-body-lg text-body-lg text-secondary-fixed font-semibold">世界是你的游乐场</p>
            <p class="font-body-md text-body-md text-on-surface-variant">你的人生主线任务是体验世界</p>
          </div>
          <div class="flex flex-col gap-space-xs pl-space-sm font-body-md text-body-md text-on-surface leading-relaxed">
            <p class="text-primary font-medium">欢迎来到长隆欢乐世界</p>
            <p>跨年旅程即将上线</p>
            <p>今年记得约上你的搭子</p>
            <p>偶遇你最喜欢的游戏角色</p>
            <p>畅玩过山车和大摆锤</p>
            <p>听一场飘雪音乐大秀</p>
            <p class="text-on-surface-variant tracking-widest">...</p>
          </div>
          <div class="pt-space-xs flex items-center gap-space-xs text-tertiary">
            <span class="material-symbols-outlined text-[18px]"
              style="font-variation-settings: 'FILL' 1;">favorite</span>
            <p class="font-headline-sm text-headline-sm text-on-surface">祝你在游乐场玩得开心！</p>
          </div>
        </div>
        <button
          class="relative w-full py-4 px-space-lg rounded-full bg-secondary-container text-on-secondary-fixed font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-xl shadow-secondary-container/30 active:scale-95 transition-all cursor-pointer"
          id="invite-cta-btn" type="button">
          <span>这次，去玩点不一样的→</span>
        </button>
      </div>
    </div>
    <script>
      (function () {
        const btn = document.getElementById('invite-cta-btn');
        if (btn) {
          btn.addEventListener('click', function () {
            btn.classList.add('scale-95');
            setTimeout(function () {
              btn.classList.remove('scale-95');
            }, 150);
            location.href = './task.html';
          });
        }
      })();
    </script>
  </main>
  <div aria-hidden="true" data-snapdom-sandbox="true" id="snapdom-sandbox"
    style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div>

</body>

</html>
