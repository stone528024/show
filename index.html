<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完美拍照二维码识别</title>
    <!-- 引入强大的扫码引擎 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- 引入图片压缩与方向纠正神器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.2.1/compressor.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .upload-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 15px 20px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .upload-btn:hover {
            background-color: #0056b3;
        }

        #fileInput {
            display: none;
        }

        #result-box {
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            word-wrap: break-word;
            min-height: 80px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 16px;
            line-height: 1.5;
        }

        .success {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
        }

        .info {
            color: #17a2b8;
            font-weight: bold;
        }

        #preview-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: none;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 style="margin-top:0;">📸 完美拍照扫码器</h2>
        <p style="font-size: 13px; color: #666; text-align: left;">
            已内置相片方向自动纠正功能，彻底解决手机拍照无法识别的问题。
        </p>

        <!-- 加上 capture="environment" 提示手机优先打开后置相机拍照 -->
        <label class="upload-btn" for="fileInput">📷 拍照 / 选图识别</label>
        <input type="file" id="fileInput" accept="image/*">

        <div id="result-box">
            等待操作...
        </div>

        <!-- 预览图 -->
        <img id="preview-img" alt="预览图">
        <!-- 引擎占位符 -->
        <div id="reader-placeholder" style="display: none;"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const resultBox = document.getElementById('result-box');
        const previewImg = document.getElementById('preview-img');

        // 初始化扫码引擎
        const html5QrCode = new Html5Qrcode("reader-placeholder");

        fileInput.addEventListener('change', function (e) {
            if (e.target.files.length === 0) return;

            const file = e.target.files[0];
            showMsg('📷 正在校正照片并解析中，请稍候...', 'info');

            // ==========================================
            // 核心黑科技：使用 Compressor.js 修复拍照问题
            // ==========================================
            new Compressor(file, {
                quality: 0.8,
                maxWidth: 1600,  // 限制最大宽度，防止千万像素卡死浏览器
                maxHeight: 1600,
                checkOrientation: true, // ★ 最关键参数：自动读取手机硬件角度，把横向乱码的照片转正！

                success(resultBlob) {
                    // 将修复后的照片转化为 File 对象
                    const fixedFile = new File([resultBlob], file.name, { type: file.type });

                    // 显示修复后的预览图
                    previewImg.src = URL.createObjectURL(fixedFile);
                    previewImg.style.display = 'block';

                    // 交给扫码引擎进行极速解析
                    html5QrCode.scanFile(fixedFile, false)
                        .then(decodedText => {
                            successHandle(decodedText);
                        })
                        .catch(err => {
                            showMsg('❌ 未识别到二维码。<br><br>可能原因：<br>1. 拍照手抖模糊<br>2. 距离过远导致二维码太小<br>建议：把手机稍微拉远一点点，保证画面清晰再拍。', 'error');
                        })
                        .finally(() => {
                            fileInput.value = ''; // 允许重复拍照
                        });
                },
                error(err) {
                    showMsg('照片处理失败: ' + err.message, 'error');
                },
            });
        });

        // 成功处理
        function successHandle(text) {
            let html = `<span class="success">✅ 提取成功！</span><br><br><strong>解析内容：</strong><br><span style="font-size:16px;">${text}</span>`;
            if (text.startsWith('http://') || text.startsWith('https://')) {
                html += `<br><br><a href="${text}" target="_blank" style="display:inline-block; padding:10px 20px; background:#28a745; color:white; text-decoration:none; border-radius:5px;">🔗 打开链接</a>`;
            }
            resultBox.innerHTML = html;
        }

        function showMsg(html, type) {
            let colorClass = '';
            if (type === 'error') colorClass = 'error';
            if (type === 'info') colorClass = 'info';
            resultBox.innerHTML = `<span class="${colorClass}">${html}</span>`;
        }
    </script>

</body>

</html>
