<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极原图二维码识别</title>
    <!-- 引入强大的企业级识别引擎 html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .upload-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 15px 20px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .upload-btn:hover {
            background-color: #0056b3;
        }

        #fileInput {
            display: none;
        }

        #result-box {
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            word-wrap: break-word;
            min-height: 80px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 16px;
            line-height: 1.5;
        }

        .success {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
        }

        .error {
            color: #dc3545;
            font-weight: bold;
        }

        .info {
            color: #17a2b8;
            font-weight: bold;
        }

        /* 图片预览区 */
        #preview-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: none;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 style="margin-top:0;">📸 高精度图片识别</h2>
        <p style="font-size: 13px; color: #666; text-align: left;">
            系统将直接分析原始高清图像（无论二维码在右上角还是哪个位置都能精准捕获）。
        </p>

        <!-- 选择文件按钮 -->
        <label class="upload-btn" for="fileInput">📷 拍照 / 从相册选择</label>
        <input type="file" id="fileInput" accept="image/*">

        <div id="result-box">
            等待上传图片...
        </div>

        <!-- 原生图片预览，避免 Canvas 导致图片模糊 -->
        <img id="preview-img" alt="预览图">

        <!-- 引擎需要的隐藏占位符 -->
        <div id="reader-placeholder" style="display: none;"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const resultBox = document.getElementById('result-box');
        const previewImg = document.getElementById('preview-img');

        // 初始化强大的扫码引擎
        const html5QrCode = new Html5Qrcode("reader-placeholder");

        fileInput.addEventListener('change', function (e) {
            if (e.target.files.length === 0) return;

            const file = e.target.files[0];

            // 1. UI 变化：显示原图预览，提示正在解析
            previewImg.src = URL.createObjectURL(file);
            previewImg.style.display = 'block';
            showMsg('正在使用强力引擎解析原图，请稍候...', 'info');

            // 2. 核心：直接把 File 对象传给引擎，不经过任何 Canvas 污染！
            // 第二个参数 false 表示不输出底层日志
            html5QrCode.scanFile(file, false)
                .then(decodedText => {
                    // 识别成功
                    successHandle(decodedText);
                })
                .catch(err => {
                    // 识别失败
                    showMsg('❌ 未识别到二维码。<br><br>可能原因：<br>1. 二维码本身太模糊或有反光<br>2. 图片中包含多个复杂的图形干扰<br>建议：尽量裁切图片，只保留二维码部分再试。', 'error');
                })
                .finally(() => {
                    // 清空 input，允许重新上传同一张图
                    fileInput.value = '';
                });
        });

        // 成功后的处理
        function successHandle(text) {
            let html = `<span class="success">✅ 提取成功！</span><br><br><strong>解析内容：</strong><br><span style="font-size:16px;">${text}</span>`;
            if (text.startsWith('http://') || text.startsWith('https://')) {
                html += `<br><br><a href="${text}" target="_blank" style="display:inline-block; padding:10px 20px; background:#28a745; color:white; text-decoration:none; border-radius:5px;">🔗 打开链接</a>`;
            }
            resultBox.innerHTML = html;
        }

        // 显示信息
        function showMsg(html, type) {
            let colorClass = '';
            if (type === 'error') colorClass = 'error';
            if (type === 'info') colorClass = 'info';
            resultBox.innerHTML = `<span class="${colorClass}">${html}</span>`;
        }
    </script>

</body>

</html>
