<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar · 快乐8实战复盘</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#3b82f6',
                        kl8win: '#f59e0b',
                        kl8pred: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        /* 丝滑滚动与通用动效 */
        * {
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        .grid-slot {
            height: 62px;
        }

        /* 弹窗与卡片动效 */
        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-animate {
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes ballBounce {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .ball-pop {
            animation: ballBounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>

<body class="bg-[#f8fafc] text-slate-800 font-sans h-screen flex flex-col overflow-hidden select-none antialiased">

    <!-- 顶部导航栏 (完美复刻参考截图) -->
    <header class="h-16 bg-white border-b border-slate-200/80 px-6 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center gap-6">
            <!-- Logo -->
            <div class="flex items-center gap-2.5">
                <div
                    class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center shadow-md shadow-blue-500/25">
                    <i class="fa-regular fa-calendar-check text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-800">Calendar</span>
            </div>

            <!-- 日期翻页区 -->
            <div class="flex items-center gap-2">
                <button id="todayBtn"
                    class="px-3.5 py-1.5 border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition active:scale-95">Today</button>
                <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg p-0.5">
                    <button id="prevBtn"
                        class="p-1.5 hover:bg-white hover:shadow-sm rounded-md text-slate-500 hover:text-slate-800 transition active:scale-90"><i
                            class="fa-solid fa-chevron-left text-[11px]"></i></button>
                    <button id="nextBtn"
                        class="p-1.5 hover:bg-white hover:shadow-sm rounded-md text-slate-500 hover:text-slate-800 transition active:scale-90"><i
                            class="fa-solid fa-chevron-right text-[11px]"></i></button>
                </div>
                <span id="currentDateTitle" class="text-lg font-bold text-slate-700 ml-2 tracking-tight">2026年10月</span>
            </div>
        </div>

        <!-- 顶部右侧视图切换与快捷操作 -->
        <div class="flex items-center gap-4">
            <button onclick="openImportModal()"
                class="px-3 py-1.5 bg-amber-50 text-amber-700 border border-amber-200/80 hover:bg-amber-100 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition active:scale-95 shadow-sm">
                <i class="fa-solid fa-cloud-arrow-up text-amber-600"></i> 导入快乐8开奖
            </button>

            <!-- Day / Week / Month 视图胶囊 -->
            <div
                class="bg-slate-100/80 p-1 rounded-xl flex text-xs font-medium text-slate-500 border border-slate-200/60 shadow-inner">
                <button id="viewDay" onclick="switchView('day')"
                    class="px-3.5 py-1.5 rounded-lg transition duration-200">Day</button>
                <button id="viewWeek" onclick="switchView('week')"
                    class="px-3.5 py-1.5 rounded-lg bg-white text-slate-800 shadow-sm font-semibold transition duration-200">Week</button>
                <button id="viewMonth" onclick="switchView('month')"
                    class="px-3.5 py-1.5 rounded-lg transition duration-200">Month</button>
            </div>

            <div class="flex items-center gap-3 border-l pl-4 border-slate-200">
                <button class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition"><i
                        class="fa-solid fa-magnifying-glass"></i></button>
                <div
                    class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-blue-500/20">
                    A
                </div>
            </div>
        </div>
    </header>

    <!-- 主体工作区 -->
    <div class="flex flex-1 overflow-hidden">

        <!-- 左侧边栏 (原版精致排版) -->
        <aside class="w-64 bg-white border-r border-slate-200/80 p-4 flex flex-col shrink-0 overflow-y-auto z-10">

            <!-- 蓝色 + Create 按钮 (完全还原) -->
            <button onclick="openPredictionModal()"
                class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-medium rounded-xl shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 transition duration-200 active:scale-[0.98] mb-6 text-sm">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Create</span>
            </button>

            <!-- 迷你月历 (截图质感) -->
            <div class="mb-6 pb-6 border-b border-slate-100">
                <div class="flex items-center justify-between mb-3 px-1">
                    <span id="miniMonthTitle" class="text-xs font-bold text-slate-700">2026年10月</span>
                    <div class="flex items-center gap-0.5 text-slate-400">
                        <button onclick="changeMiniMonth(-1)"
                            class="hover:text-slate-600 p-1 rounded hover:bg-slate-50 transition"><i
                                class="fa-solid fa-chevron-left text-[10px]"></i></button>
                        <button onclick="changeMiniMonth(1)"

                                class="fa-solid fa-chevron-right text-[10px]"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-slate-400 font-semibold mb-1">
                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                </div>
                <div id="miniCalendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
            </div>

            <!-- 日历分类清单 (仅保留快乐8两项专精分类) -->
            <div class="mb-6 flex-1">
                <div class="flex items-center justify-between mb-3 px-1">
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">日历分类</span>
                    <span class="text-[11px] text-blue-600 font-medium cursor-pointer hover:underline">全选</span>
                </div>
                <div class="space-y-1.5">
                    <label
                        class="flex items-center gap-2.5 text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-2 rounded-xl transition">
                        <input type="checkbox" checked onchange="toggleCategory('kl8win')"
                            class="rounded text-amber-500 focus:ring-0 w-4 h-4 cursor-pointer">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50"></span>
                        <span class="font-medium flex-1">快乐8实战中奖</span>
                        <span id="count-kl8win"
                            class="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded-md font-mono">0</span>
                    </label>
                    <label
                        class="flex items-center gap-2.5 text-xs text-slate-700 cursor-pointer hover:bg-slate-50 p-2 rounded-xl transition">
                        <input type="checkbox" checked onchange="toggleCategory('kl8pred')"
                            class="rounded text-indigo-500 focus:ring-0 w-4 h-4 cursor-pointer">
                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-sm shadow-indigo-500/50"></span>
                        <span class="font-medium flex-1">快乐8每日推演</span>
                        <span id="count-kl8pred"
                            class="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded-md font-mono">0</span>
                    </label>
                </div>
            </div>

            <!-- 中奖小统计卡片 (微渐变毛玻璃感) -->
            <div
                class="bg-gradient-to-br from-amber-50/80 via-orange-50/50 to-white border border-amber-200/60 rounded-2xl p-3.5 shadow-sm text-xs">
                <div class="flex items-center justify-between text-amber-800 font-bold mb-2.5">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-trophy text-amber-500"></i>实战战绩</span>
                    <span
                        class="text-[10px] bg-amber-100/80 text-amber-700 px-1.5 py-0.5 rounded-md font-medium">近30期</span>
                </div>
                <div class="grid grid-cols-2 gap-2 text-slate-600">
                    <div class="bg-white/90 p-2 rounded-xl border border-amber-100 shadow-2xs">
                        <div class="text-[10px] text-slate-400">斩获奖金</div>
                        <div id="statTotalMoney" class="text-base font-extrabold text-amber-600 mt-0.5">￥0</div>
                    </div>
                    <div class="bg-white/90 p-2 rounded-xl border border-amber-100 shadow-2xs">
                        <div class="text-[10px] text-slate-400">中奖胜率</div>
                        <div id="statWinRate" class="text-base font-extrabold text-emerald-600 mt-0.5">0%</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主日历画布 (时间轴网格) -->
        <main class="flex-1 flex flex-col overflow-hidden bg-white">
            <!-- 星期表头 -->
            <div id="calendarHeader"
                class="border-b border-slate-200/80 bg-white grid grid-cols-8 shrink-0 text-center z-10"></div>
            <!-- 滚动时间网格 -->
            <div id="calendarBody" class="flex-1 overflow-y-auto relative bg-[#fafafa]"></div>
        </main>
    </div>

    <!-- 弹窗 1：录入 / 编辑每日推演 (支持AI文本一键智能提取) -->
    <div id="predModal"
        class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-lg overflow-hidden modal-animate">

                <div class="flex items-center justify-between mb-4">

                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </div>
                        <h3 class="text-base font-bold text-slate-800">录入 / 编辑推演数据 (5组选5)</h3>
                    </div>
                    <button onclick="closePredictionModal()"

                            class="fa-solid fa-xmark"></i></button>
                </div>

                <form id="predForm" onsubmit="savePrediction(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">期号</label>
                            <input type="text" id="predCode" required placeholder="如：2026279"
                                class="w-full text-xs font-mono border border-slate-200 rounded-xl px-3 py-2 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">开奖日期</label>
                            <input type="date" id="predDate" required
                                class="w-full text-xs border border-slate-200 rounded-xl px-3 py-2 bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        </div>
                    </div>

                    <!-- 一键智能识别框 -->
                    <div class="bg-blue-50/40 border border-blue-100 rounded-2xl p-3">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-xs font-bold text-blue-900"><i
                                    class="fa-solid fa-bolt text-blue-500 mr-1"></i>快捷粘贴推演文本</span>
                            <button type="button" onclick="autoParsePastedText()"
                                class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded-lg font-semibold shadow-sm transition active:scale-95">自动提取5组</button>
                        </div>
                        <textarea id="predFastPaste" rows="2" placeholder="直接把每天分析结果整段粘贴在此处，点击右上角【自动提取5组】..."
                            class="w-full text-xs border border-blue-200/80 rounded-xl p-2.5 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition"></textarea>
                    </div>

                    <!-- 5组号码输入区 -->
                    <div class="space-y-2 pt-1">
                        <span class="text-xs font-bold text-slate-600 block">5组选5号码 (逗号或空格分隔)：</span>
                        <div class="grid grid-cols-1 gap-1.5 text-xs font-mono">
                            <div
                                class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
                                <span class="text-slate-400 font-sans text-[11px] w-12 shrink-0">第1组</span>
                                <input type="text" id="grp-0" required placeholder="如：23, 32, 56, 65, 68"
                                    class="flex-1 bg-transparent focus:outline-none text-slate-700 font-bold">
                            </div>
                            <div
                                class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
                                <span class="text-slate-400 font-sans text-[11px] w-12 shrink-0">第2组</span>
                                <input type="text" id="grp-1" required placeholder="如：54, 58, 63, 66, 68"
                                    class="flex-1 bg-transparent focus:outline-none text-slate-700 font-bold">
                            </div>
                            <div
                                class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
                                <span class="text-slate-400 font-sans text-[11px] w-12 shrink-0">第3组</span>
                                <input type="text" id="grp-2" required placeholder="如：07, 23, 46, 65, 73"
                                    class="flex-1 bg-transparent focus:outline-none text-slate-700 font-bold">
                            </div>
                            <div
                                class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
                                <span class="text-slate-400 font-sans text-[11px] w-12 shrink-0">第4组</span>
                                <input type="text" id="grp-3" required placeholder="如：20, 23, 46, 50, 73"
                                    class="flex-1 bg-transparent focus:outline-none text-slate-700 font-bold">
                            </div>
                            <div
                                class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
                                <span class="text-slate-400 font-sans text-[11px] w-12 shrink-0">第5组</span>
                                <input type="text" id="grp-4" required placeholder="如：16, 23, 33, 66, 76"
                                    class="flex-1 bg-transparent focus:outline-none text-slate-700 font-bold">
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
                        <button type="button" onclick="closePredictionModal()"
                            class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">取消</button>
                        <button type="submit"
                            class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-blue-500/20 transition active:scale-95">保存推演数据</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 弹窗 2：导入快乐8官方开奖 -->
    <div id="importModal"
        class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-lg overflow-hidden modal-animate">
            <div class="p-6">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2.5">
                        <div
                            class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold text-sm shadow-sm">
                            <i class="fa-solid fa-cloud-arrow-up"></i>

                    </div>
                    <button onclick="closeImportModal()"
                        class="w-7 h-7 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>
                <p class="text-xs text-slate-500 mb-3">粘贴官方格式的开奖数据（单期或多期数组），系统将自动完成中奖碰撞与算奖：</p>
                <textarea id="kl8JsonInput" rows="7" placeholder='[
  {
    "code": "2026278",
    "date": "2026-10-19(一)",
    "red": "01,06,08,15,17,21,22,24,29,31,33,39,41,47,48,49,60,71,72,76"
  }
]' class="w-full text-xs font-mono border border-slate-200 rounded-2xl p-3 bg-slate-50/50 text-slate-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition mb-4"></textarea>

                <div class="flex items-center justify-between">
                    <button type="button" onclick="loadSampleData()"
                        class="text-xs text-blue-600 hover:underline font-semibold">载入内置3期开奖</button>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="closeImportModal()"
                            class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">取消</button>
                        <button type="button" onclick="confirmImportKl8()"
                            class="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-amber-500/20 transition active:scale-95">立即解析开奖</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 弹窗 3：精美开奖与中奖复盘全屏卡片 -->
    <div id="kl8DetailModal"
        class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-lg overflow-hidden modal-animate">
            <div
                class="bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 p-6 text-white flex items-center justify-between">
                <div>
                    <div class="flex items-center gap-2 mb-1.5">
                        <span
                            class="text-[11px] bg-white/20 backdrop-blur-md px-2.5 py-0.5 rounded-full font-mono font-bold tracking-wide"
                            id="detailIssue">第2026278期</span>
                        <span class="text-xs text-amber-100 font-medium" id="detailDate">2026-10-19</span>
                    </div>
                    <h4 class="text-xl font-black tracking-tight" id="detailPrizeTitle">实战结果</h4>
                </div>
                <button onclick="closeKl8DetailModal()"
                    class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition"><i
                        class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="p-6 space-y-4 text-xs">
                <div>
                    <span class="font-bold text-slate-700 block mb-2.5 text-xs">官方开奖红球 (20枚)：</span>
                    <div id="detailRedBalls" class="flex flex-wrap gap-1.5 font-mono font-bold"></div>
                </div>

                <div class="border-t border-slate-100 pt-3.5">
                    <div class="flex items-center justify-between mb-2.5">
                        <span class="font-bold text-slate-700 text-xs">每日推演 5 组选 5 命中情况：</span>
                        <span
                            class="text-[11px] text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md font-semibold">金底高亮为当期命中</span>
                    </div>
                    <div id="detailPredGroups" class="space-y-1.5 font-mono"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 基础状态与初始内置实战数据
        // ==========================================
        let currentView = 'week';
        let anchorDate = new Date(2026, 9, 20); // 锚定在 2026-10-20 (周二)

        const initialKl8Records = [
            {
                code: "2026276",
                date: "2026-10-17",
                red: ["02", "06", "07", "11", "15", "18", "22", "27", "30", "32", "37", "38", "42", "45", "51", "62", "65", "66", "67", "73"],

            {

            },
            {

        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getMondayOfWeek(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        // 自动算奖计算
        function calcKl8Win(record) {
            if (!record.red || record.red.length === 0) {
                return { isDrawn: false, money: 0, bestHits: 0, title: '已推演 · 待开奖' };
            }
            if (!record.predictions || record.predictions.length === 0) {
                return { isDrawn: true, money: 0, bestHits: 0, title: '已开奖 · 无推演' };
            }
            const redSet = new Set(record.red);
            let bestHits = 0;
            let totalMoney = 0;

            record.predictions.forEach(grp => {
                let hit = 0;
                grp.forEach(b => { if (redSet.has(b)) hit++; });
                if (hit > bestHits) bestHits = hit;

                if (hit === 5) totalMoney += 1000;
                else if (hit === 4) totalMoney += 21;
                else if (hit === 3) totalMoney += 3;
            });

            let title = `最高中 ${bestHits} 码`;
            if (bestHits === 5) title = '选五中五 ￥1000！';
            else if (bestHits === 4) title = '选五中四 ￥21！';
            else if (bestHits === 3) title = '选五中三 ￥3';

            return { isDrawn: true, money: totalMoney, bestHits, title };
        }

        // 智能提取 5 组选 5
        function autoParsePastedText() {
            const text = document.getElementById('predFastPaste').value;
            if (!text.trim()) {
                alert('请先将每天的推演分析文本粘贴在上方输入框内！');
                return;
            }

            const lines = text.split('\n');
            const foundGroups = [];

            for (let line of lines) {
                const numbers = line.match(/\b\d{2}\b/g) || line.match(/\b\d{1,2}\b/g);
                if (numbers && numbers.length >= 5) {
                    const formatted = numbers.slice(0, 5).map(n => n.padStart(2, '0'));
                    foundGroups.push(formatted);
                    if (foundGroups.length === 5) break;
                }
            }

            if (foundGroups.length > 0) {
                foundGroups.forEach((grp, idx) => {
                    if (idx < 5) document.getElementById('grp-' + idx).value = grp.join(', ');
                });
                alert(`🎉 成功智能提取出 ${foundGroups.length} 组选5号码！`);
            } else {
                alert('未能自动识别出5组号码，请手动填写下方号码框。');
            }
        }

        function savePrediction(e) {
            e.preventDefault();
            const code = document.getElementById('predCode').value.trim();
            const date = document.getElementById('predDate').value;

            const predictions = [];
            for (let i = 0; i < 5; i++) {
                const val = document.getElementById('grp-' + i).value.trim();
                const nums = val.replace(/[，、\s]/g, ',').split(',').filter(Boolean).map(n => n.trim().padStart(2, '0'));
                predictions.push(nums);
            }

            let records = getStoredKl8();
            const existIdx = records.findIndex(r => r.code === code);

            if (existIdx >= 0) {
                records[existIdx].date = date;
                records[existIdx].predictions = predictions;
            } else {
                records.push({ code, date, red: [], predictions });
            }

            records.sort((a, b) => a.code.localeCompare(b.code));
            saveStoredKl8(records);
            closePredictionModal();
        }

        function confirmImportKl8() {
            try {
                const val = document.getElementById('kl8JsonInput').value.trim();
                const parsed = JSON.parse(val);
                if (!Array.isArray(parsed)) throw new Error('输入必须是JSON数组格式');

                let records = getStoredKl8();

                parsed.forEach(item => {
                    const dateClean = item.date.split('(')[0].trim();
                    const redArr = Array.isArray(item.red) ? item.red : item.red.split(',').map(s => s.trim().padStart(2, '0'));

                    const existIdx = records.findIndex(r => r.code === item.code);
                    if (existIdx >= 0) {
                        records[existIdx].red = redArr;
                        records[existIdx].date = dateClean;
                    } else {
                        records.push({
                            code: item.code,
                            date: dateClean,
                            red: redArr,
                            predictions: item.predictions || []
                        });
                    }
                });

                records.sort((a, b) => a.code.localeCompare(b.code));
                saveStoredKl8(records);
                closeImportModal();
                alert('🎉 官方开奖导入成功！已自动完成所有中奖比对与高亮。');
            } catch (err) {
                alert('JSON 格式有误，解析失败：' + err.message);
            }
        }

        function openKl8Detail(code) {
            const record = getStoredKl8().find(r => r.code === code);
            if (!record) return;

            document.getElementById('detailIssue').innerText = `第${record.code}期`;
            document.getElementById('detailDate').innerText = record.date;

            const win = calcKl8Win(record);
            document.getElementById('detailPrizeTitle').innerText = win.title;

            const redContainer = document.getElementById('detailRedBalls');
            if (record.red && record.red.length) {
                redContainer.innerHTML = record.red.map(b => `
          <span class="w-7 h-7 rounded-full bg-gradient-to-tr from-red-600 to-rose-500 text-white flex items-center justify-center text-[11px] shadow-sm ball-pop">${b}</span>
        `).join('');
            } else {
                redContainer.innerHTML = '<span class="text-slate-400">待官方开奖</span>';
            }

            const redSet = new Set(record.red || []);
            const groupContainer = document.getElementById('detailPredGroups');
            groupContainer.innerHTML = (record.predictions || []).map((grp, idx) => {
                const hits = grp.filter(b => redSet.has(b)).length;
                return `
          <div class="p-2.5 bg-slate-50/80 border border-slate-100 rounded-xl flex items-center justify-between">
            <span class="font-sans font-bold text-slate-400">第${idx + 1}组:</span>
            <div class="flex items-center gap-1.5">
              ${grp.map(b => `
                <span class="px-2 py-0.5 rounded-lg text-xs font-bold transition duration-200 ${redSet.has(b) ? 'bg-amber-500 text-white shadow-md shadow-amber-500/25 scale-105' : 'bg-white border text-slate-700'}">${b}</span>
              `).join('')}
            </div>
            <span class="font-sans ${hits >= 3 ? 'text-amber-600 font-bold' : 'text-slate-400'}">${hits} 命中</span>
          </div>
        `;
            }).join('');

            document.getElementById('kl8DetailModal').classList.remove('hidden');
        }

        function closeKl8DetailModal() {
            document.getElementById('kl8DetailModal').classList.add('hidden');
        }
    </script>
</body>

</html>
