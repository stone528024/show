<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端公共资源文档库</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 优化全局细滚动条 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        /* 页面切换平滑淡入动效 */
        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-page-enter {
            animation: pageFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body class="bg-[#f8fafc] text-slate-800 h-screen flex flex-col font-sans overflow-hidden">

    <!-- ================= 顶部 Toast 提示组件 ================= -->
    <div id="toast"
        class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-2 bg-slate-900/90 backdrop-blur-md text-white text-xs px-4 py-2.5 rounded-full shadow-lg pointer-events-none opacity-0 -translate-y-4 transition-all duration-300">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span id="toastMsg" class="font-medium tracking-wide">复制成功</span>
    </div>

    <!-- ================= 1. 顶部导航条 ================= -->
    <header class="h-16 bg-white border-b border-slate-100 px-6 flex items-center justify-between flex-shrink-0 z-20">
        <!-- 左侧 Logo & 标题 -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
            <div
                class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center text-white shadow-sm shadow-indigo-200">
                <i data-lucide="layers" class="w-4 h-4"></i>
            </div>
            <h1 class="text-base font-bold text-slate-900 tracking-tight">前端公共资源文档库</h1>
        </div>

        <!-- 右侧：搜索框 & 头像 -->
        <div class="flex items-center space-x-4">
            <div class="relative w-80">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" placeholder="搜索组件、mixin、工具JS"
                    class="w-full pl-9 pr-8 py-1.5 bg-slate-50 hover:bg-slate-100/80 focus:bg-white text-xs rounded-full border border-slate-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition outline-none text-slate-600 placeholder-slate-400">
                <i data-lucide="search"
                    class="w-3.5 h-3.5 text-slate-400 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>

            <div class="flex items-center">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&h=120&q=80"
                    alt="Avatar" class="w-8 h-8 rounded-full object-cover ring-2 ring-indigo-50">
            </div>
        </div>
    </header>

    <!-- ================= 主体区域 ================= -->
    <div class="flex-1 flex overflow-hidden">

        <!-- ================= 2. 左侧侧边栏 (已加宽到 w-80) ================= -->
        <aside class="w-80 bg-white border-r border-slate-100 flex flex-col flex-shrink-0">
            <nav id="menuContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- 侧边栏由 JS 动态生成 -->
            </nav>
        </aside>

        <!-- ================= 3. 右侧公共展示区域 (自适应撑满，无宽度上限) ================= -->
        <main class="flex-1 overflow-y-auto p-8 flex flex-col justify-between">
            <div class="w-full">
                <!-- 顶部二级 Tabs (支持高亮切换) -->
                <div class="flex items-center space-x-2 mb-8" id="navTabs">
                    <button onclick="goHome()" id="tab-home"
                        class="px-4 py-1.5 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow-sm shadow-indigo-200">
                        首页
                    </button>
                    <button onclick="handleTabClick('Vue公共组件', 'tab-comp')" id="tab-comp"
                        class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white transition">
                        组件库
                    </button>
                    <button onclick="handleTabClick('Mixins混入', 'tab-mixin')" id="tab-mixin"
                        class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white transition">
                        Mixins混入
                    </button>
                    <button onclick="handleTabClick('工具JS', 'tab-util')" id="tab-util"
                        class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white transition">
                        工具JS
                    </button>
                    <button onclick="showAIRules()" id="tab-rules"
                        class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white transition">
                        AI协作规则
                    </button>
                </div>

                <!-- 动态页面主容器 (带淡入动效) -->
                <div id="contentView" class="w-full"></div>
            </div>

            <!-- 底部说明 -->
            <footer class="mt-16 text-center text-xs text-slate-400">
                文档数据维护在 <code class="text-slate-500 bg-slate-100 px-1 py-0.5 rounded">data.js</code>，已启用 AI 全参数结构化提取
            </footer>
        </main>

    </div>

    <!-- 引入资产数据 -->
    <script src="./data.js"></script>

    <!-- 逻辑控制器 -->
    <script>
        let currentActiveId = null;
        let toastTimer = null;

        function init() {
            renderMenu();
            goHome();

            document.getElementById('searchInput').addEventListener('input', (e) => {
                const kw = e.target.value.trim().toLowerCase();
                renderMenu(kw);
            });
        }

        // 轻量全局 Toast 提示
        function showToast(msg = '复制成功') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;

            // 清除旧定时器
            if (toastTimer) clearTimeout(toastTimer);

            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 1800);
        }

        // 渲染左侧菜单
        function renderMenu(keyword = '') {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            DOCS_DATA.forEach(group => {
                const filtered = group.items.filter(item =>
                    item.name.toLowerCase().includes(keyword) ||
                    item.id.toLowerCase().includes(keyword) ||
                    item.desc.toLowerCase().includes(keyword)
                );

                const groupDiv = document.createElement('div');
                groupDiv.className = 'space-y-1.5';

                groupDiv.innerHTML = `
          <div class="flex items-center justify-between text-xs font-medium text-slate-500 px-3 py-1 cursor-pointer hover:text-slate-800">
            <div class="flex items-center space-x-2">
              <i data-lucide="${group.icon}" class="w-4 h-4 text-slate-400"></i>
              <span>${group.category}</span>
            </div>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
          </div>
          <div class="space-y-1 pl-2">
            ${filtered.length > 0 ? filtered.map(item => `
              <div 
                onclick="showDetail('${item.id}')"
                class="flex items-center justify-between px-3 py-2 text-xs rounded-lg cursor-pointer transition ${currentActiveId === item.id ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}">
                <span class="truncate pr-2">${item.name}</span>
                <span class="text-[11px] text-slate-400 flex-shrink-0">${item.label || ''}</span>
              </div>
            `).join('') : `
              <div class="text-[11px] text-slate-300 px-3 py-1.5 italic">暂无项 (待上传)</div>
            `}
          </div>
        `;
                container.appendChild(groupDiv);
            });

            lucide.createIcons();
        }

        // 渲染首页
        function goHome() {
            currentActiveId = null;
            renderMenu();
            updateTabStyle('tab-home');

            const compCount = DOCS_DATA.find(g => g.category === 'Vue公共组件')?.items.length || 0;
            const mixinCount = DOCS_DATA.find(g => g.category === 'Mixins混入')?.items.length || 0;
            const utilCount = DOCS_DATA.find(g => g.category === '工具JS')?.items.length || 0;

            const view = document.getElementById('contentView');
            view.className = "w-full animate-page-enter";
            view.innerHTML = `
        <div class="space-y-8 w-full">
          <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">前端公共资源文档库</h2>
            <p class="text-xs text-slate-400 mt-2">记录公共组件、Mixin与工具JS，已适配 AI 结构化全参数注入</p>
          </div>

          <!-- 三大统计资产卡片 (自适应铺开) -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div onclick="handleTabClick('Vue公共组件', 'tab-comp')" class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm hover:shadow-md transition cursor-pointer relative overflow-hidden group">
              <div class="w-8 h-8 rounded-lg bg-indigo-500 text-white flex items-center justify-center mb-4">
                <i data-lucide="component" class="w-4 h-4"></i>
              </div>
              <h3 class="text-sm font-bold text-slate-800">Vue组件库</h3>
              <p class="text-xs text-slate-400 mt-2 line-clamp-2 leading-relaxed">
                收集公共组件、上传组件、顶部导航、空缺省状态等。
              </p>
              <div class="mt-4 flex items-center justify-between text-xs text-indigo-500 font-medium">
                <span>已录入 ${compCount} 个</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></i>
              </div>
            </div>

            <div onclick="handleTabClick('Mixins混入', 'tab-mixin')" class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm hover:shadow-md transition cursor-pointer relative overflow-hidden group">
              <div class="w-8 h-8 rounded-lg bg-sky-500 text-white flex items-center justify-center mb-4">
                <i data-lucide="copy" class="w-4 h-4"></i>
              </div>
              <h3 class="text-sm font-bold text-slate-800">Mixins混入</h3>
              <p class="text-xs text-slate-400 mt-2 line-clamp-2 leading-relaxed">
                通用分页混入、表格状态自适应、防抖节流混入等复用逻辑。
              </p>
              <div class="mt-4 flex items-center justify-between text-xs text-sky-500 font-medium">
                <span>已录入 ${mixinCount} 个</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></i>
              </div>
            </div>

            <div onclick="handleTabClick('工具JS', 'tab-util')" class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm hover:shadow-md transition cursor-pointer relative overflow-hidden group">
              <div class="w-8 h-8 rounded-lg bg-blue-500 text-white flex items-center justify-center mb-4">
                <i data-lucide="file-code" class="w-4 h-4"></i>
              </div>
              <h3 class="text-sm font-bold text-slate-800">工具JS</h3>
              <p class="text-xs text-slate-400 mt-2 line-clamp-2 leading-relaxed">
                高频正则校验、时间日期格式化、微信登录授权等辅助方法。
              </p>
              <div class="mt-4 flex items-center justify-between text-xs text-blue-500 font-medium">
                <span>已录入 ${utilCount} 个</span>
                <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></i>
              </div>
            </div>
          </div>

          <!-- 本站作用说明 -->
          <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-4">
            <h3 class="text-sm font-bold text-slate-900">本站作用</h3>
            <ul class="space-y-3 text-xs text-slate-600">
              <li class="flex items-center space-x-2">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                <span>统一管理已封装资源，标注引入路径、全量Props、Emit事件与用法示例</span>
              </li>
              <li class="flex items-center space-x-2">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                <span>结构化导出 AI Prompt，确保大模型精准传参与事件绑定，杜绝重复手写已有源码</span>
              </li>
            </ul>
          </div>
        </div>
      `;
            lucide.createIcons();
        }

        // 渲染分类概览卡片页（点击顶部 Tab 时）
        function handleTabClick(categoryName, tabId) {
            updateTabStyle(tabId);
            currentActiveId = null;
            renderMenu();

            const group = DOCS_DATA.find(g => g.category === categoryName);
            const items = group ? group.items : [];

            const view = document.getElementById('contentView');
            view.className = "w-full animate-page-enter";

            view.innerHTML = `
        <div class="w-full space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-slate-900 flex items-center space-x-2">
                <i data-lucide="${group?.icon || 'layers'}" class="w-5 h-5 text-indigo-500"></i>
                <span>${categoryName}</span>
              </h2>
              <p class="text-xs text-slate-400 mt-1">共收录 ${items.length} 个封装资源</p>
            </div>
          </div>

          ${items.length > 0 ? `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              ${items.map(item => `
                <div onclick="showDetail('${item.id}')" class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-[11px] px-2 py-0.5 rounded font-medium ${item.isGlobal ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-amber-50 text-amber-600 border border-amber-100'}">
                        ${item.isGlobal ? '全局' : '按需'}
                      </span>
                      <span class="text-[11px] text-slate-400">${item.label || ''}</span>
                    </div>
                    <h3 class="text-sm font-bold text-slate-800 group-hover:text-indigo-600 transition">${item.name}</h3>
                    <p class="text-xs text-slate-400 mt-2 line-clamp-2 leading-relaxed">${item.desc}</p>
                  </div>
                  <div class="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between text-xs text-indigo-500 font-medium">
                    <span>查看详情 & 复制 Prompt</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></i>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="bg-white rounded-2xl p-12 text-center text-slate-400 text-xs border border-slate-100">
              该分类暂无录入项，随时将你的代码发给我即可自动更新！
            </div>
          `}
        </div>
      `;
            lucide.createIcons();
        }

        // 渲染详情页
        function showDetail(id) {
            currentActiveId = id;
            renderMenu();

            let targetItem = null;
            let targetCat = null;
            for (const group of DOCS_DATA) {
                const found = group.items.find(i => i.id === id);
                if (found) {
                    targetItem = found;
                    targetCat = group.category;
                    break;
                }
            }
            if (!targetItem) return;

            // 自动高亮对应所属的分类 Tab
            if (targetCat === 'Vue公共组件') updateTabStyle('tab-comp');
            else if (targetCat === 'Mixins混入') updateTabStyle('tab-mixin');
            else if (targetCat === '工具JS') updateTabStyle('tab-util');

            const aiPromptText = generateAIPrompt(targetItem);
            const propsList = targetItem.props || [];
            const emitsList = targetItem.emits || [];
            const slotsList = targetItem.slots || [];

            const view = document.getElementById('contentView');
            view.className = "w-full animate-page-enter";
            view.innerHTML = `
        <div class="w-full space-y-6">
          <!-- 头部卡片 -->
          <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-start justify-between">
            <div>
              <div class="flex items-center space-x-3 mb-1">
                <h2 class="text-xl font-bold text-slate-900">${targetItem.name}</h2>
                <span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${targetItem.isGlobal ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-amber-50 text-amber-600 border border-amber-200'}">
                  ${targetItem.isGlobal ? '全局已注册 (无需引入)' : '按需引入 (需要import)'}
                </span>
                ${targetItem.tag ? `<code class="text-xs bg-slate-100 text-indigo-600 px-2 py-0.5 rounded">&lt;${targetItem.tag}&gt;</code>` : ''}
              </div>
              <p class="text-xs text-slate-400 mt-1">${targetItem.desc}</p>
            </div>
            
            <button onclick="copyToClipboard(\`${encodeURIComponent(aiPromptText)}\`)" 
              class="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-medium transition shadow-sm shadow-indigo-200 flex-shrink-0">
              <i data-lucide="bot" class="w-3.5 h-3.5"></i>
              <span>复制 AI 完整提示词</span>
            </button>
          </div>

          <!-- 引入路径 -->
          <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-2">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">引入路径</h3>
            ${targetItem.isGlobal ? `
              <div class="p-3 bg-emerald-50/60 border border-emerald-100 text-emerald-700 text-xs rounded-lg">
                ✅ 该组件已全局挂载，页面中<strong>无需写 import</strong>，直接在模板中使用标签 <code>&lt;${targetItem.tag || targetItem.id}&gt;</code> 即可。
              </div>
            ` : `
              <pre class="bg-slate-900 text-slate-100 p-3 rounded-lg text-xs font-mono overflow-x-auto"><code>${targetItem.importStatement}</code></pre>
            `}
          </div>

          <!-- Props 传参 -->
          <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-3">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider flex items-center space-x-1.5">
              <i data-lucide="sliders" class="w-3.5 h-3.5 text-indigo-500"></i>
              <span>Props 属性说明 (${propsList.length})</span>
            </h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-slate-100 text-slate-400">
                    <th class="py-2.5 px-3">属性名</th>
                    <th class="py-2.5 px-3">类型</th>
                    <th class="py-2.5 px-3">默认值</th>
                    <th class="py-2.5 px-3">功能详细说明</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50 text-slate-600">
                  ${propsList.length > 0 ? propsList.map(p => `
                    <tr>
                      <td class="py-2.5 px-3 font-mono text-indigo-600 font-semibold">${p.name}</td>
                      <td class="py-2.5 px-3 font-mono text-slate-500">${p.type}</td>
                      <td class="py-2.5 px-3 font-mono text-slate-400">${p.default || '-'}</td>
                      <td class="py-2.5 px-3 text-slate-700">${p.desc}</td>
                    </tr>
                  `).join('') : `<tr><td colspan="4" class="py-3 text-center text-slate-300 italic">无额外参数</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Emits 事件 -->
          <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-3">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider flex items-center space-x-1.5">
              <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-500"></i>
              <span>Emits / 方法事件说明 (${emitsList.length})</span>
            </h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-slate-100 text-slate-400">
                    <th class="py-2.5 px-3">事件/回调名</th>
                    <th class="py-2.5 px-3">携带参数</th>
                    <th class="py-2.5 px-3">触发时机与逻辑</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50 text-slate-600">
                  ${emitsList.length > 0 ? emitsList.map(e => `
                    <tr>
                      <td class="py-2.5 px-3 font-mono text-amber-600 font-semibold">${e.name}</td>
                      <td class="py-2.5 px-3 font-mono text-slate-500">${e.args || '无'}</td>
                      <td class="py-2.5 px-3 text-slate-700">${e.desc}</td>
                    </tr>
                  `).join('') : `<tr><td colspan="3" class="py-3 text-center text-slate-300 italic">无对外派发事件</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Slots 插槽 (如果有) -->
          ${slotsList.length > 0 ? `
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-3">
              <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider flex items-center space-x-1.5">
                <i data-lucide="layout" class="w-3.5 h-3.5 text-sky-500"></i>
                <span>Slots 插槽 (${slotsList.length})</span>
              </h3>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="border-b border-slate-100 text-slate-400">
                      <th class="py-2 px-3">插槽名称</th>
                      <th class="py-2 px-3">插槽说明</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50 text-slate-600">
                    ${slotsList.map(s => `
                      <tr>
                        <td class="py-2.5 px-3 font-mono text-sky-600 font-semibold">${s.name}</td>
                        <td class="py-2.5 px-3 text-slate-700">${s.desc}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          ` : ''}

          <!-- 代码示例 -->
          <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-2">
            <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider">调用示例</h3>
            <pre class="bg-slate-900 text-emerald-400 p-4 rounded-lg text-xs font-mono overflow-x-auto"><code>${escapeHTML(targetItem.exampleCode || '')}</code></pre>
          </div>
        </div>
      `;
            lucide.createIcons();
        }

        // AI 规则页面
        function showAIRules() {
            updateTabStyle('tab-rules');
            currentActiveId = null;
            renderMenu();

            const view = document.getElementById('contentView');
            view.className = "w-full animate-page-enter";
            view.innerHTML = `
        <div class="w-full bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900">AI 协作开发规范要求</h2>
          <p class="text-xs text-slate-500 leading-relaxed">
            后续请将此段提示作为“全局 Prompt”直接粘贴给 AI：
          </p>
          <div class="bg-slate-900 text-slate-100 p-4 rounded-xl text-xs font-mono leading-relaxed select-all">
            【开发铁律】<br>
            你是一名资深前端工程师。本工程已深度封装了一批核心公共组件、Mixin 与工具方法，严禁自行重新编写类似实现！<br>
            1. 当向你提供某个组件或工具的文档时，必须完整遵照给定的【Props 定义】和【Emits 事件】去调用；<br>
            2. 对于【已全局注册】的组件，绝对禁止写 import 导入语句，直接在模板中写标签即可；<br>
            3. 对于【按需引入】的组件或工具，必须精准使用指定的 import 路径引入。
          </div>
        </div>
      `;
            lucide.createIcons();
        }

        // 更新 Tab 高亮激活样式
        function updateTabStyle(activeTabId) {
            ['tab-home', 'tab-comp', 'tab-mixin', 'tab-util', 'tab-rules'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (id === activeTabId) {
                        el.className = "px-4 py-1.5 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow-sm shadow-indigo-200";
                    } else {
                        el.className = "px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white transition";
                    }
                }
            });
        }

        // 生成 AI 完整提示词
        function generateAIPrompt(item) {
            let prompt = `【已有前端资产规范 - 严禁自行手写重复逻辑】\n`;
            prompt += `资产名称：${item.name} ${item.tag ? `(模板标签: <${item.tag}>)` : ''}\n`;
            prompt += `注册状态：${item.isGlobal ? '已全局挂载（禁止在当前页面重写或额外写 import）' : '按需引入'}\n`;
            if (!item.isGlobal) prompt += `引入路径：${item.importStatement}\n`;
            prompt += `功能说明：${item.desc}\n\n`;

            if (item.props && item.props.length > 0) {
                prompt += `【Props 传参规范】（请根据需求正确绑定属性，不要捏造不存在的参数）：\n`;
                item.props.forEach(p => {
                    prompt += `- ${p.name} (${p.type}, 默认值: ${p.default || '无'}): ${p.desc}\n`;
                });
                prompt += `\n`;
            }

            if (item.emits && item.emits.length > 0) {
                prompt += `【Emits 事件/回调规范】：\n`;
                item.emits.forEach(e => {
                    prompt += `- @${e.name} (参数: ${e.args || '无'}): ${e.desc}\n`;
                });
                prompt += `\n`;
            }

            if (item.slots && item.slots.length > 0) {
                prompt += `【Slots 插槽】：\n`;
                item.slots.forEach(s => {
                    prompt += `- #${s.name}: ${s.desc}\n`;
                });
                prompt += `\n`;
            }

            prompt += `【推荐调用示例】：\n${item.exampleCode}\n`;
            return prompt;
        }

        // 复制剪贴板并弹出 Toast
        function copyToClipboard(encoded) {
            navigator.clipboard.writeText(decodeURIComponent(encoded)).then(() => {
                showToast('复制成功');
            }).catch(() => {
                showToast('复制失败，请重试');
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }

        window.onload = init;
    </script>
</body>

</html>
