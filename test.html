<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        .title-bar {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1f2937;
            color: #fff;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
        }

        .drag-area {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        .ctrl-group {
            display: flex;
            height: 100%;
        }

        .ctrl-btn {
            width: 36px;
            height: 100%;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .ctrl-btn:hover {
            background: #374151;
        }

        .ctrl-btn.close:hover {
            background: #ef4444;
        }

        /* 主体往下挪，避开标题栏 */
        .body-wrap {
            margin-top: 32px;
        }
    </style>
</head>

<body>
    <div class="title-bar">
        <div class="drag-area" data-tauri-drag-region>
            <span>我的应用</span>
        </div>
        <div class="ctrl-group">
            <button class="ctrl-btn" id="btnMin">─</button>
            <button class="ctrl-btn" id="btnMax">□</button>
            <button class="ctrl-btn close" id="btnClose">×</button>
        </div>
    </div>
    <div class="body-wrap">
        你的页面内容
    </div>

    <script type="module">
        import { appWindow } from 'https://esm.sh/@tauri-apps/api/window'

        const $ = s => document.querySelector(s)
        let isMax = false

        $('#btnMin').onclick = () => appWindow.minimize()
        $('#btnMax').onclick = async () => {
            isMax = await appWindow.isMaximized()
            if (isMax) await appWindow.restore()
            else await appWindow.maximize()
        }
        $('#btnClose').onclick = () => appWindow.close()
    </script>
</body>

</html>
